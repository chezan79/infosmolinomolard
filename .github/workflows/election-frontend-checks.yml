name: Election frontend checks

on:
  pull_request:
    paths:
      - 'suivi-du-vote.js'
      - 'election-engine/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/election-frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --check suivi-du-vote.js
      - run: npm test
